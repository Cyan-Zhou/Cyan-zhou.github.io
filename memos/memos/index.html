    <h1 class="single-title animate__animated animate__flipInX">Memos · 碎碎念</h1>
    <div class="memos-subtitle">记录不到500字的读书笔记与零散想法。</div>

        <span class="memo-filter-btn active" onclick="filterMemo('all')"># 全部</span>
    </div>

        <div class="memo-loading">📡 正在同步数据...</div>
    </div>
</div>

<script>

const repo = "Cyan-Zhou/blog_comment"; 
const issueNumber = 15; 

async function loadMemos() {
    const streamContainer = document.getElementById('memos-stream');
    
    try {
        const response = await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`);
        
        if (!response.ok) {
            throw new Error(`网络请求失败，状态码: ${response.status}`);
        }
        
        const comments = await response.json();

        if (!comments || comments.length === 0) {
            streamContainer.innerHTML = '<div class="memo-loading">🫙 暂无内容。</div>';
            return;
        }

        const formattedMemos = comments.map(c => ({
            author: c.user ? c.user.login : "Cyan Zhou",
            createdAt: c.created_at,
            bodyRaw: c.body || "" 
        })).filter(m => m.author === "Cyan-Zhou" || m.author === "Cyan Zhou");

        if (formattedMemos.length === 0) {
            streamContainer.innerHTML = '<div class="memo-loading">🫙 暂无内容。</div>';
        } else {
            renderMemos(formattedMemos);
        }
        
    } catch (error) {
        console.error("抓取失败:", error);
        streamContainer.innerHTML = `
            <div class="memo-loading" style="color: #ff5252;">
                ❌ <b>网络连接失败</b><br>
                <span style="font-size: 0.85rem; color: #999; margin-top: 8px; display: inline-block;">
                    无法获取数据，请检查网络连接或稍后再试。
                </span>
            </div>`;
    }
}

function renderMemos(memoData) {
    const streamContainer = document.getElementById('memos-stream');
    const filterBar = document.getElementById('tags-filter-bar');
    streamContainer.innerHTML = '';
    
    let allTags = new Set();
    const displayList = [...memoData].reverse(); 

    displayList.forEach(memo => {
        const createdAt = new Date(memo.createdAt).toLocaleString('zh-CN', { 
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hour12: false 
        });
        
        let rawContent = memo.bodyRaw;
        
        const tagRegex = /#\s*([^\s#<]+)/g;
        let tags = [];
        let match;
        while ((match = tagRegex.exec(rawContent)) !== null) {
            tags.push(match[1]);
            allTags.add(match[1]);
        }

        let cleanContent = rawContent.replace(tagRegex, '');
        let htmlContent = parseSimpleMarkdown(cleanContent);

        const memoItem = document.createElement('div');
        memoItem.className = 'memo-item animate__animated animate__fadeInUp';
        memoItem.setAttribute('data-tags', tags.join(','));

        let tagsHtml = tags.map(t => `<span class="tag-capsule" onclick="event.stopPropagation(); filterMemo('${t}')"># ${t}</span>`).join('');

        memoItem.innerHTML = `
            <div class="memo-content">
                ${htmlContent}
            </div>
            ${tags.length > 0 ? `<div class="memo-middle-tags">${tagsHtml}</div>` : ''}
            <div class="memo-footer-meta">
                <span class="memo-author">${memo.author}</span>
                <span class="memo-time">${createdAt}</span>
            </div>
        `;
        streamContainer.appendChild(memoItem);
    });

    allTags.forEach(tag => {
        if (!document.querySelector(`[data-filter-tag="${tag}"]`)) {
            const btn = document.createElement('span');
            btn.className = 'memo-filter-btn';
            btn.innerText = `# ${tag}`;
            btn.setAttribute('data-filter-tag', tag);
            btn.onclick = () => filterMemo(tag);
            filterBar.appendChild(btn);
        }
    });
}

function filterMemo(tag) {
    const buttons = document.querySelectorAll('.memo-filter-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    
    if (tag === 'all') {
        buttons[0].classList.add('active');
    } else {
        const targetBtn = document.querySelector(`[data-filter-tag="${tag}"]`);
        if (targetBtn) targetBtn.classList.add('active');
    }

    const items = document.querySelectorAll('.memo-item');
    items.forEach(item => {
        const itemTags = item.getAttribute('data-tags').split(',');
        if (tag === 'all' || itemTags.includes(tag)) {
            item.style.display = 'block';
        } else {
            item.style.display = 'none';
        }
    });
}

function parseSimpleMarkdown(text) {
    return text
        .trim()
        .replace(/\n/g, '<br>')
        .replace(/\!\[(.*?)\]\((.*?)\)/g, '<div class="memo-img-wrapper"><img src="$2" alt="$1" style="max-width:100%; border-radius:8px; margin-top:8px;"></div>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
}

document.addEventListener('DOMContentLoaded', loadMemos);
</script>
